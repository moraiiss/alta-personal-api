plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
}

group = 'br.com.altapersonal'
version = '0.0.1-SNAPSHOT'
description = 'alta-personal-api'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// No container de desenvolvimento (compose.yaml), o build vai para um volume fora do
// diretório montado, para não deixar arquivos de root no build/ do host
def containerBuildDir = System.getenv('GRADLE_BUILD_DIR')
if (containerBuildDir) {
    layout.buildDirectory = file(containerBuildDir)
}

repositories {
    mavenCentral()
}

dependencies {
    implementation libs.spring.boot.starter.data.jpa
    implementation libs.spring.boot.starter.webmvc
    implementation libs.spring.boot.starter.flyway
    implementation libs.springdoc.openapi.starter.webmvc.ui
    developmentOnly libs.spring.boot.devtools
    runtimeOnly libs.postgresql
    runtimeOnly libs.flyway.database.postgresql
    testImplementation libs.spring.boot.starter.data.jpa.test
    testImplementation libs.spring.boot.starter.webmvc.test
    testImplementation libs.archunit.junit5
    testRuntimeOnly libs.junit.platform.launcher
}

tasks.named('test') {
    useJUnitPlatform()
}
