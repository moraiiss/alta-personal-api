name: alta-personal-api

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-altapersonal}
      POSTGRES_USER: ${POSTGRES_USER:-altapersonal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-altapersonal}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: docker/dev
    init: true
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-altapersonal}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-altapersonal}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-altapersonal}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - .:/app
      - gradle-home:/gradle-home
      - gradle-project-cache:/gradle-project-cache
      - gradle-build:/gradle-build
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  gradle-home:
  gradle-project-cache:
  gradle-build:
